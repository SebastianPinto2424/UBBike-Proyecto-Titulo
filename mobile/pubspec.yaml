name: ubbike
description: Aplicacion movil para gestionar el ingreso y retiro de bicicletas en bicicleteros UBB.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.6.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  http: ^1.6.0
  qr_flutter: ^4.1.0
  image_picker: ^1.2.2
  fl_chart: ^1.2.0
  pdf: ^3.12.0
  flutter_riverpod: ^2.6.1
  flutter_secure_storage: ^9.2.2
  mobile_scanner: ^6.0.3
  socket_io_client: ^3.1.6
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  flutter_local_notifications: ^18.0.1
  geolocator: ^13.0.2
  flutter_map: ^8.3.2
  latlong2: ^0.9.1
  url_launcher: ^6.3.2
  file_saver: ^0.4.0
  share_plus: ^12.0.2
  camera: ^0.12.0+2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/imagenes/ubbike-logo-transparente.png
    - assets/certs/
